<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio di Galleggiamento (Principio di Archimede)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f9ff; /* Sfondo leggermente azzurro */
        }

        /* Styling avanzato e pulito per gli slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 10px 0;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #0284c7; /* Sky 600 */
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #bae6fd; /* Sky 200 */
            border-radius: 3px;
        }
        input[type=range]:focus {
            outline: none;
        }

        /* Container canvas responsive */
        #canvas-wrapper {
            width: 100%;
            height: 500px;
            background-color: #ffffff;
            background-image: linear-gradient(#e0f2fe 1px, transparent 1px), linear-gradient(90deg, #e0f2fe 1px, transparent 1px);
            background-size: 20px 20px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Bottoni preset liquidi */
        .preset-btn {
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .preset-btn.active {
            border-color: #0284c7;
            background-color: #e0f2fe;
            transform: scale(1.05);
            font-weight: bold;
        }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-6 min-h-screen flex flex-col">

    <div class="max-w-7xl mx-auto w-full flex-grow flex flex-col gap-6">
        
        <!-- Header -->
        <header class="bg-white p-5 rounded-2xl shadow-sm border border-sky-100 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-sky-900">Spinta di Archimede</h1>
                <p class="text-sky-600 mt-1">Laboratorio Virtuale di Galleggiamento e Densità</p>
            </div>
            <!-- Badge di Stato Dinamico -->
            <div id="status-badge" class="px-6 py-2 rounded-xl font-bold text-lg uppercase tracking-widest transition-all duration-300 bg-gray-200 text-gray-600 shadow-inner">
                CALCOLO...
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow">
            
            <div class="lg:col-span-4 flex flex-col gap-6">
                
                <!-- PANNELLO CONTROLLI -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-sky-100">
                    <h2 class="text-lg font-bold text-gray-800 mb-4 border-b border-sky-50 pb-2">Parametri Oggetto</h2>
                    
                    <div class="space-y-5">
                        <!-- Slider Massa -->
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <label class="flex justify-between font-semibold text-slate-700 mb-1">
                                <span>Massa (m)</span>
                                <span id="val-mass" class="text-slate-900 font-mono text-lg">5.0 kg</span>
                            </label>
                            <input type="range" id="slider-mass" min="0.5" max="25" value="5" step="0.5">
                            <div class="flex justify-between text-xs text-slate-400 font-mono mt-1">
                                <span>0.5 kg</span><span>25 kg</span>
                            </div>
                        </div>

                        <!-- Slider Volume -->
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <label class="flex justify-between font-semibold text-slate-700 mb-1">
                                <span>Volume (V)</span>
                                <span id="val-vol" class="text-slate-900 font-mono text-lg">10.0 L</span>
                            </label>
                            <input type="range" id="slider-vol" min="1" max="20" value="10" step="0.5">
                            <div class="flex justify-between text-xs text-slate-400 font-mono mt-1">
                                <span>1 L (dm³)</span><span>20 L</span>
                            </div>
                        </div>
                    </div>

                    <h2 class="text-lg font-bold text-gray-800 mt-8 mb-4 border-b border-sky-50 pb-2">Proprietà Liquido</h2>
                    
                    <div class="space-y-4">
                        <!-- Preset Liquidi -->
                        <div class="grid grid-cols-2 gap-2">
                            <button class="preset-btn active bg-sky-50 text-sky-800 py-2 rounded-lg text-sm shadow-sm" data-rho="1000">Acqua Dolce</button>
                            <button class="preset-btn bg-blue-50 text-blue-800 py-2 rounded-lg text-sm shadow-sm" data-rho="1025">Acqua Salata</button>
                            <button class="preset-btn bg-yellow-50 text-yellow-800 py-2 rounded-lg text-sm shadow-sm" data-rho="900">Olio Extravergine</button>
                            <button class="preset-btn bg-amber-50 text-amber-900 py-2 rounded-lg text-sm shadow-sm" data-rho="1400">Miele</button>
                        </div>
                        
                        <!-- Slider Densità Liquido (Custom) -->
                        <div class="mt-4">
                            <label class="flex justify-between font-semibold text-sky-700 mb-1">
                                <span>Densità Liquido (&rho;<sub>liq</sub>)</span>
                                <span id="val-rholiq" class="text-sky-900 font-mono text-lg">1000 kg/m³</span>
                            </label>
                            <input type="range" id="slider-rholiq" min="500" max="2000" value="1000" step="10">
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 flex flex-col gap-6">
                
                <!-- DASHBOARD RISULTATI IN TEMPO REALE -->
                <div class="bg-slate-800 text-white p-5 rounded-2xl shadow-md border border-slate-700 grid grid-cols-2 md:grid-cols-4 gap-4">
                    
                    <div class="bg-slate-700/50 p-3 rounded-xl border border-slate-600 flex flex-col">
                        <span class="text-xs uppercase tracking-wide text-slate-400 font-semibold mb-1">Densità Oggetto</span>
                        <div class="flex items-baseline gap-1 mt-auto">
                            <span id="out-rho-obj" class="text-2xl font-bold font-mono text-white">500</span>
                            <span class="text-sm text-slate-400">kg/m³</span>
                        </div>
                    </div>

                    <div class="bg-red-900/30 p-3 rounded-xl border border-red-800 flex flex-col">
                        <span class="text-xs uppercase tracking-wide text-red-300 font-semibold mb-1">Forza Peso (Giù)</span>
                        <div class="flex items-baseline gap-1 mt-auto">
                            <span id="out-fp" class="text-2xl font-bold font-mono text-red-100">49.0</span>
                            <span class="text-sm text-red-300">N</span>
                        </div>
                    </div>

                    <div class="bg-blue-900/30 p-3 rounded-xl border border-blue-800 flex flex-col">
                        <span class="text-xs uppercase tracking-wide text-blue-300 font-semibold mb-1">Spinta Archimede (Su)</span>
                        <div class="flex items-baseline gap-1 mt-auto">
                            <span id="out-fa" class="text-2xl font-bold font-mono text-blue-100">49.0</span>
                            <span class="text-sm text-blue-300">N</span>
                        </div>
                    </div>

                    <div class="bg-green-900/30 p-3 rounded-xl border border-green-800 flex flex-col">
                        <span class="text-xs uppercase tracking-wide text-green-300 font-semibold mb-1">Volume Immerso</span>
                        <div class="flex items-baseline gap-1 mt-auto">
                            <span id="out-vimm" class="text-2xl font-bold font-mono text-green-100">5.0</span>
                            <span class="text-sm text-green-300">L</span>
                        </div>
                    </div>

                </div>

                <!-- AREA CANVAS -->
                <div class="bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden relative">
                    <div id="canvas-wrapper">
                        <canvas id="simCanvas"></canvas>
                    </div>
                    <!-- Drop/Reset Button Overlay -->
                    <button id="btn-drop" class="absolute top-4 right-4 bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 px-4 rounded-xl shadow-lg transition active:scale-95 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Solleva Oggetto
                    </button>
                    <!-- Legenda Vettori -->
                    <div class="absolute bottom-4 left-4 bg-white/90 p-2 rounded shadow text-xs font-semibold flex gap-4 border border-slate-200">
                        <div class="flex items-center gap-1 text-red-600"><span class="w-3 h-3 bg-red-500 rounded-sm inline-block"></span> Forza Peso (Fp)</div>
                        <div class="flex items-center gap-1 text-blue-600"><span class="w-3 h-3 bg-blue-500 rounded-sm inline-block"></span> Spinta di Archimede (Fa)</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- 1. SETUP DOM & VARIABILI ---
        const els = {
            m: document.getElementById('slider-mass'),
            v: document.getElementById('slider-vol'),
            rhoLiq: document.getElementById('slider-rholiq'),
            
            valM: document.getElementById('val-mass'),
            valV: document.getElementById('val-vol'),
            valRhoLiq: document.getElementById('val-rholiq'),
            
            outRhoObj: document.getElementById('out-rho-obj'),
            outFp: document.getElementById('out-fp'),
            outFa: document.getElementById('out-fa'),
            outVimm: document.getElementById('out-vimm'),
            
            badge: document.getElementById('status-badge'),
            canvas: document.getElementById('simCanvas'),
            wrapper: document.getElementById('canvas-wrapper'),
            presets: document.querySelectorAll('.preset-btn'),
            btnDrop: document.getElementById('btn-drop')
        };

        const ctx = els.canvas.getContext('2d');
        const g = 9.81;
        
        // Colori Liquidi in base alla densità approssimativa
        function getLiquidColor(rho) {
            if (rho <= 900) return 'rgba(250, 204, 21, 0.4)';  // Olio (Giallo)
            if (rho >= 1300) return 'rgba(217, 119, 6, 0.5)'; // Miele (Ambra)
            if (rho > 1005) return 'rgba(59, 130, 246, 0.4)'; // Acqua Salata (Blu denso)
            return 'rgba(56, 189, 248, 0.3)';                 // Acqua Dolce (Azzurro chiaro)
        }

        // Colore Oggetto in base alla densità
        function getObjectColor(rho) {
            if (rho < 400) return '#fde047'; // Sughero/Polistirolo (Giallo chiaro)
            if (rho < 800) return '#d97706'; // Legno (Marrone)
            if (rho < 1200) return '#dc2626'; // Plastica dura/Gomma (Rosso)
            if (rho < 3000) return '#94a3b8'; // Alluminio/Pietra (Grigio chiaro)
            return '#334155'; // Ferro/Piombo (Grigio scuro)
        }

        // --- 2. STATO E FISICA ---
        let state = {
            m: 5,           // kg
            vL: 10,         // L (dm³) = 0.001 m³
            rhoObj: 500,    // kg/m³
            rhoLiq: 1000,   // kg/m³
            
            // Variabili per l'animazione fisica
            cw: 0, ch: 0,   // Canvas width/height
            scale: 600,     // Pixel per Metro (es: 10cm = 60px)
            
            // Coordinate
            waterY: 200,    // Livello superficie acqua in px
            tankBottomY: 450,
            
            // Stato Oggetto
            y: 50,          // Posizione Y del centro dell'oggetto (parte sollevato)
            vy: 0,          // Velocità verticale
            sideSize: 0,    // Lato del quadrato (calcolato dal volume radice cubica)
            
            // Risultati Real-time
            currentFa: 0,
            currentVimmL: 0
        };

        // --- STREAMING_CHUNK:Building Canvas Rendering Logic... ---
        function resize() {
            state.cw = els.wrapper.clientWidth;
            state.ch = els.wrapper.clientHeight;
            els.canvas.width = state.cw;
            els.canvas.height = state.ch;
            state.waterY = state.ch * 0.45;
            state.tankBottomY = state.ch * 0.95;
            updateLogic();
        }
        window.addEventListener('resize', resize);

        // Disegna frecce
        function drawArrow(x, y, length, color, direction = 1, label = "") {
            if (length < 2) return; // Non disegnare frecce invisibili
            
            ctx.beginPath();
            ctx.moveTo(x, y);
            const endY = y + (length * direction);
            ctx.lineTo(x, endY);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.stroke();

            // Punta freccia
            const headlen = 12;
            ctx.beginPath();
            ctx.moveTo(x, endY);
            ctx.lineTo(x - 8, endY - (headlen * direction));
            ctx.lineTo(x + 8, endY - (headlen * direction));
            ctx.fillStyle = color;
            ctx.fill();
            
            // Testo
            if (label) {
                ctx.fillStyle = color;
                ctx.font = 'bold 14px Inter';
                ctx.textAlign = (x > state.cw/2) ? 'left' : 'right';
                const offset = (x > state.cw/2) ? 15 : -15;
                ctx.fillText(label, x + offset, endY - (20 * direction));
            }
        }

        function drawScene() {
            ctx.clearRect(0, 0, state.cw, state.ch);

            // Disegna Vasca
            const tankWidth = state.cw * 0.6;
            const tankLeft = (state.cw - tankWidth) / 2;
            const tankTop = state.waterY - 30; // Bordo vasca poco sopra l'acqua
            
            ctx.fillStyle = '#f8fafc'; // Sfondo vasca interno
            ctx.fillRect(tankLeft, tankTop, tankWidth, state.tankBottomY - tankTop);
            
            // Disegna Acqua
            ctx.fillStyle = getLiquidColor(state.rhoLiq);
            ctx.fillRect(tankLeft, state.waterY, tankWidth, state.tankBottomY - state.waterY);
            
            // Bordo Vasca (spesso)
            ctx.beginPath();
            ctx.moveTo(tankLeft, tankTop);
            ctx.lineTo(tankLeft, state.tankBottomY);
            ctx.lineTo(tankLeft + tankWidth, state.tankBottomY);
            ctx.lineTo(tankLeft + tankWidth, tankTop);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 8;
            ctx.lineJoin = 'round';
            ctx.stroke();

            // Onda superficie
            ctx.beginPath();
            ctx.moveTo(tankLeft, state.waterY);
            for(let i = 0; i <= tankWidth; i+=10) {
                // Piccolo effetto ondina statica
                const waveY = state.waterY + Math.sin(i * 0.05 + performance.now()*0.002) * 2;
                ctx.lineTo(tankLeft + i, waveY);
            }
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Disegna Oggetto
            const objX = state.cw / 2;
            const s = state.sideSize;
            
            ctx.fillStyle = getObjectColor(state.rhoObj);
            // Bordo arrotondato
            ctx.beginPath();
            ctx.roundRect(objX - s/2, state.y - s/2, s, s, 8);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Disegna livello acqua sull'oggetto se è parzialmente immerso
            const top = state.y - s/2;
            const bottom = state.y + s/2;
            if (bottom > state.waterY && top < state.waterY) {
                ctx.beginPath();
                ctx.moveTo(objX - s/2, state.waterY);
                ctx.lineTo(objX + s/2, state.waterY);
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // VETTORI FORZA
            // Fp (Sempre costante)
            const fp = state.m * g;
            const fpVisualLen = Math.min(fp * 0.5, 120); // Scala visiva limitata
            drawArrow(objX + 10, state.y, fpVisualLen, '#dc2626', 1, 'Fp');

            // Fa (Dipende da quanto è immerso ATTUALMENTE durante l'animazione)
            const faVisualLen = Math.min(state.currentFa * 0.5, 120);
            if (state.currentFa > 0.1) {
                drawArrow(objX - 10, state.y, faVisualLen, '#2563eb', -1, 'Fa');
            }
        }

        // --- STREAMING_CHUNK:Implementing the simulation loop and Archimedes logic... ---
        function updateLogic() {
            // Lettura Inputs
            state.m = parseFloat(els.m.value);
            state.vL = parseFloat(els.v.value);
            state.rhoLiq = parseFloat(els.rhoLiq.value);
            
            // Calcoli di base
            const vM3 = state.vL * 0.001; // Conversione L -> m³
            state.rhoObj = state.m / vM3; // Densità kg/m³
            
            // Calcolo Dimensione Visiva Quadrato (Proporzionale alla radice cubica del volume)
            // Se 1L (0.001 m³) ha lato 0.1m. Scala a video.
            const sideMeters = Math.cbrt(vM3); 
            state.sideSize = sideMeters * state.scale;

            // --- AGGIORNAMENTO UI TESTUALE ---
            els.valM.textContent = state.m.toFixed(1) + ' kg';
            els.valV.textContent = state.vL.toFixed(1) + ' L';
            els.valRhoLiq.textContent = state.rhoLiq + ' kg/m³';
            
            els.outRhoObj.textContent = Math.round(state.rhoObj);
            
            const fp = state.m * g;
            els.outFp.textContent = fp.toFixed(1);

            // Calcolo Target Fisico Teorico a regime
            let targetFa = 0;
            let targetVimmL = 0;
            
            if (state.rhoObj < state.rhoLiq) {
                // Galleggia
                els.badge.textContent = 'GALLEGGIA';
                els.badge.className = "px-6 py-2 rounded-xl font-bold text-lg uppercase tracking-widest transition-all duration-300 bg-green-100 text-green-700 shadow-sm border border-green-300";
                targetVimmL = state.vL * (state.rhoObj / state.rhoLiq);
                targetFa = fp; // La spinta eguaglia il peso
            } else if (Math.abs(state.rhoObj - state.rhoLiq) < 5) {
                // Equilibrio Indifferente
                els.badge.textContent = 'EQUILIBRIO';
                els.badge.className = "px-6 py-2 rounded-xl font-bold text-lg uppercase tracking-widest transition-all duration-300 bg-yellow-100 text-yellow-700 shadow-sm border border-yellow-300";
                targetVimmL = state.vL;
                targetFa = fp;
            } else {
                // Affonda
                els.badge.textContent = 'AFFONDA';
                els.badge.className = "px-6 py-2 rounded-xl font-bold text-lg uppercase tracking-widest transition-all duration-300 bg-red-100 text-red-700 shadow-sm border border-red-300";
                targetVimmL = state.vL;
                targetFa = state.rhoLiq * vM3 * g;
            }
        }

        // Loop di Animazione (Fisica in tempo reale basata su molla/smorzamento)
        function animationLoop() {
            // 1. Determina il Target Y verso cui l'oggetto vuole andare
            const fp = state.m * g;
            let targetY;
            
            if (state.rhoObj >= state.rhoLiq) {
                // Affonda fino in fondo
                targetY = state.tankBottomY - (state.sideSize / 2);
            } else {
                // Galleggia
                // Ratio di immersione (quanto % dell'altezza è sott'acqua)
                const ratio = state.rhoObj / state.rhoLiq;
                // La parte bassa del blocco affonda di (sideSize * ratio) sotto l'acqua
                // Y centro = Y_acqua + (immersione) - (metà_lato)
                targetY = state.waterY + (state.sideSize * ratio) - (state.sideSize / 2);
            }

            // 2. Sistema a Molla (Spring Physics) verso il Target
            // k è la rigidità (dipende in natura dalla superficie, qui simuliamo)
            // L'acqua è "dura" da penetrare, ma cerchiamo un effetto morbido visivo
            const k = 0.05; 
            const damp = 0.85; // Attrito/Frenata
            
            const force = (targetY - state.y) * k;
            state.vy += force;
            state.vy *= damp;
            state.y += state.vy;

            // Evita che attraversi il fondo
            const maxBottom = state.tankBottomY - (state.sideSize / 2);
            if (state.y > maxBottom) {
                state.y = maxBottom;
                state.vy = 0;
            }

            // 3. Calcolo real-time del Volume Immerso in base alla Y attuale
            const top = state.y - state.sideSize / 2;
            const bottom = state.y + state.sideSize / 2;
            
            let hImm = 0;
            if (bottom > state.waterY) {
                hImm = Math.min(state.sideSize, bottom - state.waterY);
            }
            
            const ratioImm = hImm / state.sideSize;
            state.currentVimmL = state.vL * ratioImm;
            state.currentFa = state.rhoLiq * (state.currentVimmL * 0.001) * g;

            // Aggiorna Numeri Dashboard
            els.outVimm.textContent = state.currentVimmL.toFixed(1);
            els.outFa.textContent = state.currentFa.toFixed(1);

            // 4. Disegna e prosegui
            drawScene();
            requestAnimationFrame(animationLoop);
        }

        // --- STREAMING_CHUNK:Attaching events and kicking off the application... ---
        
        // Listeners Slider
        [els.m, els.v, els.rhoLiq].forEach(el => {
            el.addEventListener('input', () => {
                updateLogic();
                // Deseleziona preset se muovo lo slider della densità manualmente
                if (el === els.rhoLiq) {
                    els.presets.forEach(p => p.classList.remove('active', 'bg-e0f2fe'));
                }
            });
        });

        // Listeners Bottoni Presets
        els.presets.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Rimuovi classe attiva da tutti
                els.presets.forEach(p => p.classList.remove('active', 'bg-e0f2fe'));
                // Aggiungi al cliccato
                e.target.classList.add('active');
                
                // Aggiorna slider e logica
                els.rhoLiq.value = e.target.getAttribute('data-rho');
                updateLogic();
            });
        });

        // Pulsante "Solleva Oggetto" per far rivedere la caduta
        els.btnDrop.addEventListener('click', () => {
            state.y = 20; // Lo porta in alto
            state.vy = 5; // Gli dà una piccola spinta verso il basso
        });

        // INIT
        window.onload = () => {
            updateLogic();
            resize(); // Triggera anche la prima drawScene() e calcoli dimensioni
            
            // Inizia il loop posizionando l'oggetto in alto
            state.y = 50;
            animationLoop();
        };

    </script>
</body>
</html>
