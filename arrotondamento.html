<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulatore: Regole dell'Arrotondamento</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .math-font {
            font-family: 'JetBrains Mono', monospace;
        }

        input[type=text] {
            font-family: 'JetBrains Mono', monospace;
        }

        .tab-btn {
            transition: all 0.2s ease-in-out;
        }

        .cut-line {
            display: inline-block;
            border-left: 4px dashed #ef4444;
            height: 1.2em;
            vertical-align: middle;
            margin: 0 4px;
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { border-color: #ef4444; }
            50% { border-color: #fca5a5; }
            100% { border-color: #ef4444; }
        }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-8 min-h-screen flex flex-col">

    <div class="max-w-5xl mx-auto w-full flex-grow flex flex-col gap-6">
        
        <!-- Intestazione e Navigazione -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-emerald-400 to-teal-500"></div>
            <h1 class="text-3xl md:text-4xl font-bold text-slate-800 mb-2 mt-2">Taglio e Arrotondamento</h1>
            <p class="text-slate-500 mb-6">Impara a decidere come arrotondare un numero osservando la cifra decisiva.</p>
            
            <div class="flex justify-center gap-4 flex-wrap">
                <button id="tab-explore" class="tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-teal-100 text-teal-700 border-2 border-teal-200 shadow-sm">
                    🔍 Modalità Esplora
                </button>
                <button id="tab-challenge" class="tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-slate-100 text-slate-500 border-2 border-transparent hover:bg-slate-200">
                    🎯 Modalità Sfida
                </button>
            </div>
        </header>

        <!-- ==========================================
             MODALITÀ ESPLORA
        =========================================== -->
        <div id="section-explore" class="flex-grow flex flex-col gap-6">
            
            <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200 flex flex-col items-center">
                
                <button id="btn-generate-rand" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold py-2 px-6 rounded-lg transition-colors border border-emerald-300 mb-6 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Genera Nuovo Numero
                </button>

                <!-- Numero di Partenza -->
                <div class="text-center mb-8">
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-wide mb-2">Numero di partenza</p>
                    <div id="explore-original" class="text-5xl md:text-7xl font-bold math-font text-slate-800 bg-slate-50 px-8 py-4 rounded-2xl border border-slate-200">
                        12,34567
                    </div>
                </div>

                <!-- Bottoni Azione -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full max-w-3xl">
                    <button class="btn-round bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-4 rounded-xl shadow border-b-4 border-blue-700 active:translate-y-1 active:border-b-0 transition-transform" data-dec="1">
                        Arrotonda alla 1ª decimale
                    </button>
                    <button class="btn-round bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-4 px-4 rounded-xl shadow border-b-4 border-indigo-700 active:translate-y-1 active:border-b-0 transition-transform" data-dec="2">
                        Arrotonda alla 2ª decimale
                    </button>
                    <button class="btn-round bg-violet-500 hover:bg-violet-600 text-white font-bold py-4 px-4 rounded-xl shadow border-b-4 border-violet-700 active:translate-y-1 active:border-b-0 transition-transform" data-dec="3">
                        Arrotonda alla 3ª decimale
                    </button>
                </div>

                <!-- Spiegazione (Inizialmente Nascosta) -->
                <div id="explore-breakdown" class="mt-8 w-full max-w-3xl hidden">
                    <div class="bg-slate-800 text-white p-6 rounded-2xl shadow-inner">
                        <p class="text-center text-sm uppercase tracking-widest text-slate-400 font-bold mb-4">Analisi del Taglio</p>
                        
                        <!-- Visualizzazione Taglio -->
                        <div id="visual-cut" class="text-4xl md:text-6xl text-center math-font font-bold mb-6 tracking-wide">
                            <!-- Inserito da JS -->
                        </div>

                        <!-- Legenda -->
                        <div class="flex justify-center gap-4 text-xs font-bold uppercase tracking-wider mb-6 flex-wrap">
                            <span class="flex items-center gap-1"><div class="w-3 h-3 bg-blue-400 rounded-full"></div> Da conservare</span>
                            <span class="flex items-center gap-1"><div class="w-3 h-3 bg-red-500 rounded-full"></div> Cifra Decisiva</span>
                            <span class="flex items-center gap-1"><div class="w-3 h-3 bg-slate-500 rounded-full"></div> Da scartare</span>
                        </div>

                        <!-- Testo Spiegazione -->
                        <div id="explore-logic-text" class="bg-slate-700/50 p-5 rounded-xl border border-slate-600 text-lg leading-relaxed">
                            <!-- Inserito da JS -->
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- ==========================================
             MODALITÀ SFIDA
        =========================================== -->
        <div id="section-challenge" class="flex-grow flex flex-col gap-6 hidden">
            
            <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200 text-center relative max-w-4xl mx-auto w-full">
                <span class="inline-block px-4 py-1 bg-amber-100 text-amber-800 font-bold rounded-full text-xs uppercase tracking-wider mb-4 border border-amber-200">Database Scienze Integrate</span>
                
                <h2 id="chal-scenario" class="text-2xl font-bold text-slate-700 leading-tight mb-2">
                    <!-- Scenario -->
                </h2>
                
                <p id="chal-target-text" class="text-lg font-bold text-teal-600 mb-6 uppercase tracking-wider">
                    <!-- Arrotonda alla X decimale -->
                </p>

                <div class="flex justify-center items-center gap-4 flex-wrap">
                    <div class="bg-slate-100 border border-slate-300 px-6 py-4 rounded-xl">
                        <span class="block text-xs font-bold text-slate-400 uppercase mb-1">Valore Originale</span>
                        <span id="chal-original" class="text-3xl font-bold math-font text-slate-800">0,000</span>
                    </div>
                    
                    <svg class="w-8 h-8 text-slate-400 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    
                    <div class="flex flex-col items-start w-full md:w-auto">
                        <span class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">Tua Risposta</span>
                        <div class="flex items-center">
                            <input type="text" inputmode="decimal" id="chal-input" class="math-font text-3xl text-center border-2 border-teal-300 rounded-xl p-4 w-48 focus:border-teal-500 focus:outline-none transition-colors" placeholder="es. 4,50">
                        </div>
                    </div>
                </div>

                <button id="btn-verify-chal" class="mt-8 w-full max-w-sm mx-auto bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-8 rounded-xl shadow-lg transform transition active:scale-95 text-xl flex justify-center items-center gap-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    VERIFICA
                </button>

                <!-- Area Feedback Sfida -->
                <div id="chal-feedback" class="mt-6 w-full p-6 rounded-xl hidden border text-left">
                    <!-- Popolato da JS -->
                </div>

                <!-- Prossima -->
                <button id="btn-next-chal" class="mt-6 text-blue-600 font-bold hover:text-blue-800 transition-colors hidden text-lg flex items-center justify-center gap-2 mx-auto">
                    Prossima Sfida <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>

        </div>

    </div>

    <script>
        // --- STREAMING_CHUNK:Inizializzazione e Utilità---

        // Funzione per forzare il formato virgola nell'input dello studente
        function enforceCommaFormat(inputElement) {
            // Sostituisce i punti con le virgole
            let val = inputElement.value.replace(/\./g, ',');
            // Rimuove qualsiasi carattere che non sia cifra, virgola o segno meno (solo all'inizio)
            val = val.replace(/(?!^-)[^0-9,]/g, '');
            // Se ci sono più virgole, tiene solo la prima
            let parts = val.split(',');
            if (parts.length > 2) {
                val = parts[0] + ',' + parts.slice(1).join('');
            }
            inputElement.value = val;
            return val;
        }

        // Funzione per arrotondare robustamente gestendo i float di Javascript
        // Ritorna una stringa formattata con la virgola e il numero corretto di decimali
        function roundAndFormat(num, decimals) {
            const factor = Math.pow(10, decimals);
            // Uso Number.EPSILON per risolvere problemi tipo 1.005 -> 1.00 invece di 1.01
            const rounded = Math.round((num + Number.EPSILON) * factor) / factor;
            return rounded.toFixed(decimals).replace('.', ',');
        }

        // --- Gestione TAB ---
        const tabExplore = document.getElementById('tab-explore');
        const tabChallenge = document.getElementById('tab-challenge');
        const secExplore = document.getElementById('section-explore');
        const secChallenge = document.getElementById('section-challenge');

        tabExplore.addEventListener('click', () => switchTab('explore'));
        tabChallenge.addEventListener('click', () => switchTab('challenge'));

        function switchTab(mode) {
            if (mode === 'explore') {
                tabExplore.className = 'tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-teal-100 text-teal-800 border-2 border-teal-300 shadow-sm';
                tabChallenge.className = 'tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-slate-100 text-slate-500 border-2 border-transparent hover:bg-slate-200';
                secExplore.classList.remove('hidden');
                secChallenge.classList.add('hidden');
            } else {
                tabChallenge.className = 'tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-teal-100 text-teal-800 border-2 border-teal-300 shadow-sm';
                tabExplore.className = 'tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-slate-100 text-slate-500 border-2 border-transparent hover:bg-slate-200';
                secChallenge.classList.remove('hidden');
                secExplore.classList.add('hidden');
                if(!currentChallenge) loadNewChallenge();
            }
        }

        // --- STREAMING_CHUNK:Logica Modalità Esplora ---
        let exploreCurrentNumber = 0;
        const exploreOriginal = document.getElementById('explore-original');
        const exploreBreakdown = document.getElementById('explore-breakdown');
        const visualCut = document.getElementById('visual-cut');
        const exploreLogicText = document.getElementById('explore-logic-text');

        function generateExploreNumber() {
            // Genera numero tra 0 e 100 con 5 decimali
            exploreCurrentNumber = Math.random() * 100;
            exploreOriginal.textContent = exploreCurrentNumber.toFixed(5).replace('.', ',');
            exploreBreakdown.classList.add('hidden');
        }

        document.getElementById('btn-generate-rand').addEventListener('click', generateExploreNumber);

        // Funzione per generare l'HTML della spiegazione visiva e logica
        function generateExplanationHTML(numValue, decimals) {
            // Usa stringa fissa a 5 decimali per avere sempre cifre da tagliare per l'esempio
            const numStr = numValue.toFixed(5).replace('.', ','); 
            
            const commaIndex = numStr.indexOf(',');
            // Indice della cifra decisiva (quella da scartare) = posizione virgola + decimali richiesti + 1
            const decisiveIndex = commaIndex + decimals + 1;
            
            const partKept = numStr.substring(0, decisiveIndex);
            const digitDecisive = numStr.substring(decisiveIndex, decisiveIndex + 1);
            const partRest = numStr.substring(decisiveIndex + 1);

            const decValue = parseInt(digitDecisive);
            const isRoundUp = decValue >= 5;
            const finalResult = roundAndFormat(numValue, decimals);

            // Generazione HTML Visuale
            const visualHTML = `
                <span class="text-blue-400">${partKept}</span><span class="cut-line"></span><span class="text-red-500 bg-red-900/30 px-1 rounded mx-1">${digitDecisive}</span><span class="text-slate-500">${partRest}</span>
            `;

            // Generazione Testo Logica
            let logicHTML = `
                <p class="mb-2">Hai scelto di tagliare a <strong>${decimals}</strong> decimal${decimals===1?'e':'i'}.</p>
                <p class="mb-2">Guardiamo la prima cifra subito dopo il taglio (la <span class="text-red-400 font-bold">cifra decisiva</span>): è il <strong>${digitDecisive}</strong>.</p>
            `;

            if (isRoundUp) {
                logicHTML += `
                    <p class="mb-4">Poiché ${digitDecisive} è <strong>maggiore o uguale a 5</strong>, si arrotonda per <strong class="text-amber-400 uppercase">eccesso</strong>.</p>
                    <p>Aumentiamo di 1 l'ultima cifra da conservare. Il risultato finale corretto è <strong class="text-3xl text-emerald-400 font-mono bg-slate-800 px-3 py-1 rounded ml-2">${finalResult}</strong>.</p>
                `;
            } else {
                logicHTML += `
                    <p class="mb-4">Poiché ${digitDecisive} è <strong>minore di 5</strong>, si arrotonda per <strong class="text-sky-400 uppercase">difetto</strong>.</p>
                    <p>Le cifre conservate rimangono identiche, si cancella solo il resto. Il risultato finale corretto è <strong class="text-3xl text-emerald-400 font-mono bg-slate-800 px-3 py-1 rounded ml-2">${finalResult}</strong>.</p>
                `;
            }

            return { visualHTML, logicHTML };
        }

        // Listener per i bottoni dell'esplora
        document.querySelectorAll('.btn-round').forEach(btn => {
            btn.addEventListener('click', function() {
                const decs = parseInt(this.getAttribute('data-dec'));
                const { visualHTML, logicHTML } = generateExplanationHTML(exploreCurrentNumber, decs);
                
                visualCut.innerHTML = visualHTML;
                exploreLogicText.innerHTML = logicHTML;
                exploreBreakdown.classList.remove('hidden');
            });
        });

        // Genera il primo avvio
        generateExploreNumber();


        // --- STREAMING_CHUNK:Logica Modalità Sfida ---
        const challengeDB = [
            { scenario: "Volume d'acqua per irrigazione", num: 14.5678, dec: 2, note: "Normale eccesso" },
            { scenario: "Massa del campione di suolo", num: 2.996, dec: 2, note: "Trappola a cascata" },
            { scenario: "Temperatura in serra", num: 34.42, dec: 1, note: "Normale difetto" },
            { scenario: "Concentrazione fertilizzante (g/L)", num: 0.1234, dec: 3, note: "Difetto su 3 decimali" },
            { scenario: "Valore pH del terreno", num: 6.851, dec: 1, note: "Eccesso sul 5" },
            { scenario: "Peso di una mela da esportazione", num: 0.198, dec: 2, note: "Trappola a cascata" },
            { scenario: "Lunghezza di una foglia di vite (cm)", num: 12.345, dec: 2, note: "Eccesso sul 5" },
            { scenario: "Velocità del vento (m/s)", num: 15.95, dec: 1, note: "Trappola a cascata" },
            { scenario: "Area fogliare calcolata (cm²)", num: 45.3333, dec: 2, note: "Difetto continuo" },
            { scenario: "Pressione atmosferica (atm)", num: 1.01385, dec: 3, note: "Eccesso" },
            { scenario: "Diametro del fusto (cm)", num: 8.099, dec: 2, note: "Trappola a cascata con 0 finale" },
            { scenario: "Umidità relativa misurata (%)", num: 65.45, dec: 1, note: "Eccesso" },
            { scenario: "Tasso di evapotraspirazione (mm/h)", num: 4.544, dec: 2, note: "Difetto" },
            { scenario: "Densità del latte (g/cm³)", num: 1.0325, dec: 3, note: "Eccesso" },
            { scenario: "Radiazione solare incidente", num: 14.999, dec: 2, note: "Trappola a cascata" }
        ];

        let currentChallenge = null;
        let lastChallengeIndex = -1;

        const chalScenario = document.getElementById('chal-scenario');
        const chalTargetText = document.getElementById('chal-target-text');
        const chalOriginal = document.getElementById('chal-original');
        const chalInput = document.getElementById('chal-input');
        const btnVerifyChal = document.getElementById('btn-verify-chal');
        const chalFeedback = document.getElementById('chal-feedback');
        const btnNextChal = document.getElementById('btn-next-chal');

        // Formattazione in tempo reale
        chalInput.addEventListener('input', function() {
            enforceCommaFormat(this);
            this.classList.remove('border-red-500', 'border-green-500');
        });

        function loadNewChallenge() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * challengeDB.length);
            } while (newIndex === lastChallengeIndex);
            lastChallengeIndex = newIndex;
            currentChallenge = challengeDB[newIndex];

            chalScenario.textContent = currentChallenge.scenario;
            chalTargetText.textContent = `Arrotonda alla ${currentChallenge.dec}ª decimale`;
            
            // Mostra originale (qui JS usa formattazione ita per non confondere)
            // Mostriamo almeno 4 decimali per far vedere bene la coda
            let origStr = currentChallenge.num.toString().replace('.', ',');
            if (!origStr.includes(',')) origStr += ',0';
            chalOriginal.textContent = origStr;

            // Reset UI
            chalInput.value = '';
            chalInput.classList.remove('border-red-500', 'border-green-500');
            chalFeedback.classList.add('hidden');
            btnNextChal.classList.add('hidden');
            
            chalInput.focus();
        }

        function verifyChallenge() {
            const userStr = chalInput.value.trim();
            if (!userStr) return;

            // Calcolo del target esatto come stringa (con zeri preservati)
            const expectedStr = roundAndFormat(currentChallenge.num, currentChallenge.dec);

            // Resetta colori
            chalInput.classList.remove('border-red-500', 'border-green-500');

            if (userStr === expectedStr) {
                // CORRETTO
                chalInput.classList.add('border-green-500');
                showChallengeFeedback(true, `
                    <div class="flex items-center gap-3">
                        <div class="bg-green-100 p-2 rounded-full text-green-600">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-xl text-green-800">Perfetto!</h3>
                            <p class="text-green-700">Hai arrotondato correttamente e inserito il giusto numero di cifre decimali.</p>
                        </div>
                    </div>
                `);
                btnNextChal.classList.remove('hidden');
            } else {
                // SBAGLIATO
                chalInput.classList.add('border-red-500');
                
                // Genera la spiegazione dettagliata rubandola alla modalità esplora
                const { visualHTML, logicHTML } = generateExplanationHTML(currentChallenge.num, currentChallenge.dec);
                
                // Ripuliamo l'HTML della logica per adattarlo al tema chiaro della sfida
                let logicClean = logicHTML
                    .replace(/text-amber-400/g, 'text-red-700 underline')
                    .replace(/text-sky-400/g, 'text-blue-700 underline')
                    .replace(/text-emerald-400 font-mono bg-slate-800/g, 'text-slate-800 font-mono bg-slate-200 border border-slate-300')
                    .replace(/text-white/g, 'text-slate-800')
                    .replace(/text-slate-400/g, 'text-slate-600');

                // Ricostruiamo il box visuale chiaro
                let visualClean = visualHTML.replace(/text-red-500 bg-red-900\/30/g, 'text-red-600 bg-red-100');

                showChallengeFeedback(false, `
                    <div class="flex items-start gap-3 mb-4 border-b border-red-200 pb-4">
                        <div class="bg-red-100 p-2 rounded-full text-red-600 shrink-0">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-red-800">Attenzione, la risposta non è corretta.</h3>
                            <p class="text-red-700 text-sm mt-1">Ricorda: devi mantenere esattamente ${currentChallenge.dec} cifre dopo la virgola (anche se l'ultima è uno zero).</p>
                        </div>
                    </div>
                    
                    <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 text-slate-800">
                        <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-4 text-center">Rivediamo insieme il passaggio</p>
                        <div class="text-3xl md:text-4xl text-center math-font font-bold mb-6 tracking-wide">
                            ${visualClean}
                        </div>
                        <div class="text-base">
                            ${logicClean}
                        </div>
                    </div>
                `);
            }
        }

        function showChallengeFeedback(isSuccess, htmlContent) {
            chalFeedback.classList.remove('hidden', 'bg-green-50', 'border-green-200', 'bg-red-50', 'border-red-200');
            if (isSuccess) {
                chalFeedback.classList.add('bg-green-50', 'border-green-200');
            } else {
                chalFeedback.classList.add('bg-red-50', 'border-red-200');
            }
            chalFeedback.innerHTML = htmlContent;
        }

        btnVerifyChal.addEventListener('click', verifyChallenge);
        btnNextChal.addEventListener('click', loadNewChallenge);

        chalInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (btnNextChal.classList.contains('hidden')) {
                    verifyChallenge();
                } else {
                    loadNewChallenge();
                }
            }
        });

    </script>
</body>
</html>
