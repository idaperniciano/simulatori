<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprensione: Ordine di Grandezza</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        .math-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Rimuove le frecce native dagli input numerici */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* Transizioni fluide */
        .tab-btn {
            transition: all 0.2s ease;
        }
        
        #ruler-pointer {
            transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); /* Effetto elastico */
        }

        /* Stili per le tacche del righello */
        .tick {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #cbd5e1; /* slate-300 */
        }
        .tick-label {
            position: absolute;
            top: 100%;
            margin-top: 8px;
            transform: translateX(-50%);
            font-weight: 600;
            font-size: 0.875rem;
            color: #64748b; /* slate-500 */
        }

        /* Tacca speciale per il 5 */
        .tick-threshold {
            background-color: #ef4444; /* red-500 */
            width: 3px;
            z-index: 10;
        }
        .tick-label-threshold {
            color: #ef4444;
            font-weight: 700;
            font-size: 1.125rem;
            background: #fee2e2; /* red-100 */
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center">

    <div class="max-w-4xl mx-auto w-full flex-grow flex flex-col gap-6">
        
        <!-- Intestazione e Tabs -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-600 to-indigo-600"></div>
            <h1 class="text-3xl font-bold text-slate-800 mb-2 mt-2">L'Ordine di Grandezza</h1>
            <p class="text-slate-500 mb-6 text-sm">Impara la regola della soglia valutando il coefficiente.</p>
            
            <div class="flex justify-center gap-2 md:gap-4 flex-wrap">
                <button id="tab1-btn" onclick="switchTab(1)" class="tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-blue-100 text-blue-700 border-2 border-blue-200 shadow-sm">
                    🔍 Mod. Esplora
                </button>
                <button id="tab2-btn" onclick="switchTab(2)" class="tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-slate-50 text-slate-500 border-2 border-transparent hover:bg-slate-100">
                    🎯 Mod. Sfida
                </button>
            </div>
        </header>

        <!-- ==========================================
             TAB 1: MODALITÀ ESPLORA
        =========================================== -->
        <div id="tab1-content" class="bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200 flex flex-col gap-8">
            
            <!-- Area Input -->
            <div class="flex flex-col items-center gap-4 bg-slate-50 p-6 rounded-xl border border-slate-200">
                <p class="text-sm font-bold text-slate-500 uppercase tracking-wide">Inserisci un numero in notazione scientifica</p>
                
                <div class="flex items-center justify-center gap-3 text-2xl font-bold text-slate-700 math-font flex-wrap">
                    <div class="flex flex-col items-center gap-1">
                        <label class="text-xs text-slate-400 font-sans uppercase">Coefficiente (1 a 9,9)</label>
                        <input type="text" id="exp-coeff" class="text-center border-2 border-slate-300 rounded-lg p-2 w-28 focus:border-blue-500 outline-none transition-colors" placeholder="es. 4,5" value="4,5">
                    </div>
                    
                    <span class="mt-4">&times; 10</span>
                    
                    <div class="flex flex-col items-center gap-1">
                        <label class="text-xs text-slate-400 font-sans uppercase">Esponente</label>
                        <div class="flex">
                            <sup class="mt-4"><input type="text" id="exp-pow" class="text-center border-2 border-slate-300 rounded-lg p-1 w-16 focus:border-blue-500 outline-none transition-colors text-lg" placeholder="es. 3" value="3"></sup>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Area Righello -->
            <div class="w-full max-w-2xl mx-auto mt-4 mb-10">
                <p class="text-center text-sm font-bold text-slate-500 uppercase tracking-wide mb-8">Analisi del Coefficiente</p>
                
                <div class="relative w-full h-8 bg-slate-100 border-y border-slate-300 rounded-sm">
                    <!-- Tacche generate via JS -->
                    <div id="ruler-ticks" class="absolute inset-0"></div>
                    
                    <!-- Indicatore Coefficiente -->
                    <div id="ruler-pointer" class="absolute top-1/2 -translate-y-1/2 -ml-3 w-6 h-12 flex flex-col items-center" style="left: 45%;">
                        <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[14px] border-t-blue-600 drop-shadow-md"></div>
                        <div class="w-1 h-full bg-blue-600 rounded-b"></div>
                    </div>
                </div>
            </div>

            <!-- Feedback Logico -->
            <div id="explore-feedback" class="p-5 rounded-xl border-2 text-center text-lg mt-6 transition-colors duration-300">
                <!-- Popolato da JS -->
            </div>

        </div>

        <!-- ==========================================
             TAB 2: MODALITÀ SFIDA
        =========================================== -->
        <div id="tab2-content" class="bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200 hidden flex flex-col items-center gap-8 text-center">
            
            <span class="inline-block px-4 py-1 bg-amber-100 text-amber-800 font-bold rounded-full text-xs uppercase tracking-wider border border-amber-200">Allenamento Pratico</span>
            
            <h2 id="challenge-text" class="text-xl md:text-2xl font-bold text-slate-700 leading-relaxed max-w-2xl">
                <!-- Popolato da JS -->
                Un frammento di roccia ha una massa di <span class="math-font text-blue-600 bg-blue-50 px-2 rounded">4,9 &times; 10<sup>3</sup></span> kg.
            </h2>

            <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 w-full max-w-md flex flex-col items-center gap-4">
                <label class="text-sm font-bold text-slate-500 uppercase tracking-wide">Qual è il suo ordine di grandezza?</label>
                
                <div class="flex items-center justify-center gap-2 text-3xl font-bold text-slate-800 math-font">
                    <span>10</span>
                    <sup><input type="text" id="chal-input" class="text-center border-2 border-slate-300 rounded-lg p-2 w-20 focus:border-blue-500 outline-none transition-colors shadow-inner bg-white" placeholder="?" autocomplete="off"></sup>
                </div>
            </div>

            <div id="challenge-feedback" class="w-full max-w-md p-4 rounded-xl hidden border text-left">
                <!-- Feedback JS -->
            </div>

            <div class="w-full max-w-md flex gap-4">
                <button id="btn-verify" onclick="verifyChallenge()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-6 rounded-xl shadow-lg transform transition active:scale-95 flex justify-center items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    VERIFICA
                </button>
                <button id="btn-next" onclick="loadChallenge()" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-4 px-6 rounded-xl border border-blue-300 shadow-sm transition-colors hidden justify-center items-center gap-2">
                    PROSSIMA SFIDA &rarr;
                </button>
            </div>

        </div>

    </div>

    <script>
        // --- STREAMING_CHUNK:Inizializzazione e Utilità---

        // Costanti per le sfide
        const units = ['m', 'kg', 'J', 'W', 'Hz', 'L'];
        const subjects = [
            "La misura registrata in laboratorio è di",
            "Un corpo fisico possiede una grandezza pari a",
            "L'oggetto analizzato ha un valore di",
            "La strumentazione rileva",
            "L'esperimento produce un risultato di"
        ];

        let currentChallengeAnswer = 0;

        // Filtro globale per tutti gli input text: forza virgola e ammette solo numeri/meno
        function enforceFormat(e, allowComma) {
            let val = e.target.value;
            // Sostituisce punto con virgola
            val = val.replace(/\./g, ',');
            
            // Regex per permettere cifre, e opzionalmente virgola e segno meno iniziale
            if (allowComma) {
                val = val.replace(/[^\d,\-]/g, '');
                // Solo una virgola permessa
                let parts = val.split(',');
                if (parts.length > 2) val = parts[0] + ',' + parts.slice(1).join('');
            } else {
                // Solo interi e segno meno
                val = val.replace(/[^\d\-]/g, '');
            }

            // Il meno può stare solo all'inizio
            if (val.indexOf('-') > 0) {
                val = val.replace(/-/g, '');
            }

            e.target.value = val;
            
            // Rimuovi errori visivi al cambio
            e.target.classList.remove('border-red-500', 'bg-red-50');
        }

        // --- STREAMING_CHUNK:Logica Modalità Esplora---
        const inputCoeff = document.getElementById('exp-coeff');
        const inputPow = document.getElementById('exp-pow');
        const rulerPointer = document.getElementById('ruler-pointer');
        const exploreFeedback = document.getElementById('explore-feedback');

        inputCoeff.addEventListener('input', (e) => { enforceFormat(e, true); updateExplore(); });
        inputPow.addEventListener('input', (e) => { enforceFormat(e, false); updateExplore(); });

        // Disegna il righello (da 0 a 10)
        function drawRuler() {
            const container = document.getElementById('ruler-ticks');
            container.innerHTML = '';
            for (let i = 0; i <= 10; i++) {
                const pos = (i / 10) * 100;
                let tickClass = "tick";
                let labelClass = "tick-label";
                
                if (i === 5) {
                    tickClass += " tick-threshold";
                    labelClass += " tick-label-threshold";
                }
                
                // Nascondiamo 0 e 10 sui bordi estremi per estetica se necessario, ma mostriamoli.
                container.innerHTML += `
                    <div class="${tickClass}" style="left: ${pos}%;">
                        <div class="${labelClass}">${i}</div>
                    </div>
                `;
            }
        }

        function updateExplore() {
            let coeffStr = inputCoeff.value.replace(',', '.');
            let coeff = parseFloat(coeffStr);
            let powStr = inputPow.value;
            let pow = parseInt(powStr);

            if (isNaN(coeff) || isNaN(pow) || coeff < 0 || coeff > 10) {
                exploreFeedback.className = "p-5 rounded-xl border-2 border-slate-300 bg-slate-50 text-slate-500 text-center text-base mt-6";
                exploreFeedback.innerHTML = "Inserisci un coefficiente valido (tra 1 e 9,9) e un esponente intero.";
                return;
            }

            // Muovi puntatore
            let posPercentage = (coeff / 10) * 100;
            // Limita visualmente al range 0-100
            posPercentage = Math.max(0, Math.min(100, posPercentage));
            rulerPointer.style.left = `${posPercentage}%`;

            // Calcola Logica e Aggiorna Feedback
            if (coeff < 5.0) {
                exploreFeedback.className = "p-5 rounded-xl border-2 border-blue-300 bg-blue-50 text-blue-900 text-center text-lg mt-6 shadow-sm";
                exploreFeedback.innerHTML = `
                    <span class="block font-bold mb-2">Il coefficiente (${coeff.toFixed(1).replace('.', ',')}) è minore di 5.</span>
                    L'ordine di grandezza resta <strong class="math-font text-2xl ml-2">10<sup>${pow}</sup></strong>
                `;
                rulerPointer.querySelector('div:first-child').className = "w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[14px] border-t-blue-500 drop-shadow-md";
                rulerPointer.querySelector('div:last-child').className = "w-1 h-full bg-blue-500 rounded-b";
            } else {
                let newPow = pow + 1;
                exploreFeedback.className = "p-5 rounded-xl border-2 border-red-300 bg-red-50 text-red-900 text-center text-lg mt-6 shadow-sm";
                exploreFeedback.innerHTML = `
                    <span class="block font-bold mb-2">Il coefficiente (${coeff.toFixed(1).replace('.', ',')}) ha superato la soglia del 5!</span>
                    L'esponente aumenta di 1. L'ordine di grandezza passa a <strong class="math-font text-2xl ml-2">10<sup>${newPow}</sup></strong>
                `;
                rulerPointer.querySelector('div:first-child').className = "w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[14px] border-t-red-500 drop-shadow-md";
                rulerPointer.querySelector('div:last-child').className = "w-1 h-full bg-red-500 rounded-b";
            }
        }

        // --- STREAMING_CHUNK:Logica Modalità Sfida---
        const chalInput = document.getElementById('chal-input');
        const chalFeedback = document.getElementById('challenge-feedback');
        const btnVerify = document.getElementById('btn-verify');
        const btnNext = document.getElementById('btn-next');
        const chalText = document.getElementById('challenge-text');

        chalInput.addEventListener('input', (e) => enforceFormat(e, false));
        chalInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (btnNext.classList.contains('hidden')) verifyChallenge();
                else loadChallenge();
            }
        });

        function loadChallenge() {
            // Generazione caso
            let isEdgeCase = Math.random() < 0.40; // 40% probabilità di caso limite
            let coeff;
            
            if (isEdgeCase) {
                // Genera tra 4.5 e 5.4
                coeff = (Math.floor(Math.random() * 10) + 45) / 10;
            } else {
                // Genera tra 1.1 e 9.9
                coeff = (Math.floor(Math.random() * 89) + 11) / 10;
            }

            let exp;
            do { exp = Math.floor(Math.random() * 21) - 10; } while (exp === 0);

            let unit = units[Math.floor(Math.random() * units.length)];
            let subject = subjects[Math.floor(Math.random() * subjects.length)];
            
            let coeffStr = coeff.toFixed(1).replace('.', ',');

            chalText.innerHTML = `${subject} <span class="math-font text-blue-700 bg-blue-50 px-3 py-1 rounded border border-blue-200 inline-block mx-1 whitespace-nowrap">${coeffStr} &times; 10<sup>${exp}</sup></span> ${unit}.`;

            // Calcolo risposta esatta
            currentChallengeAnswer = (coeff >= 5.0) ? exp + 1 : exp;

            // Reset UI
            chalInput.value = '';
            chalInput.classList.remove('border-green-500', 'bg-green-50', 'border-red-500', 'bg-red-50');
            chalFeedback.classList.add('hidden');
            btnNext.classList.add('hidden');
            btnVerify.classList.remove('hidden');
            
            chalInput.focus();
        }

        function verifyChallenge() {
            let userStr = chalInput.value.trim();
            let userVal = parseInt(userStr);

            chalInput.classList.remove('border-red-500', 'bg-red-50', 'border-green-500', 'bg-green-50');

            if (userStr === "" || isNaN(userVal)) {
                chalInput.classList.add('border-red-500', 'bg-red-50');
                chalFeedback.className = "w-full max-w-md p-4 rounded-xl border border-red-200 bg-red-50 text-red-800 mt-4";
                chalFeedback.innerHTML = "<strong>Attenzione:</strong> Inserisci un esponente numerico.";
                chalFeedback.classList.remove('hidden');
                return;
            }

            if (userVal === currentChallengeAnswer) {
                // Corretto
                chalInput.classList.add('border-green-500', 'bg-green-50');
                chalFeedback.className = "w-full max-w-md p-4 rounded-xl border border-green-300 bg-green-50 text-green-900 mt-4";
                chalFeedback.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="text-2xl">✅</div>
                        <div>
                            <p class="font-bold">Esatto!</p>
                            <p class="text-sm mt-1">Hai applicato correttamente la regola sulla soglia del 5.</p>
                        </div>
                    </div>`;
                chalFeedback.classList.remove('hidden');
                
                btnVerify.classList.add('hidden');
                btnNext.classList.remove('hidden');
                btnNext.classList.add('flex');
            } else {
                // Errato
                chalInput.classList.add('border-red-500', 'bg-red-50');
                chalFeedback.className = "w-full max-w-md p-4 rounded-xl border border-red-300 bg-red-50 text-red-900 mt-4";
                
                // Ricava coefficiente dal DOM per il feedback (estratti dalla stringa)
                let textMatch = chalText.innerHTML.match(/>(\d+,\d+) &times;/);
                let coeffStr = textMatch ? textMatch[1] : "?";
                let coeffVal = parseFloat(coeffStr.replace(',', '.'));

                let expl = "";
                if (coeffVal >= 5.0) {
                    expl = `Il coefficiente (<strong>${coeffStr}</strong>) è &ge; 5. L'esponente doveva <strong>aumentare di 1</strong> rispetto a quello di partenza.`;
                } else {
                    expl = `Il coefficiente (<strong>${coeffStr}</strong>) è &lt; 5. L'esponente doveva <strong>restare uguale</strong> a quello di partenza.`;
                }

                chalFeedback.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="text-2xl mt-1">❌</div>
                        <div>
                            <p class="font-bold">Non ci siamo, riprova.</p>
                            <p class="text-sm mt-1">${expl}</p>
                            <p class="text-xs mt-2 italic text-red-700">Attento ai segni meno se la potenza è negativa!</p>
                        </div>
                    </div>`;
                chalFeedback.classList.remove('hidden');
            }
        }

        // --- STREAMING_CHUNK:Gestione Tabs e Avvio---
        function switchTab(tab) {
            const btn1 = document.getElementById('tab1-btn');
            const btn2 = document.getElementById('tab2-btn');
            const c1 = document.getElementById('tab1-content');
            const c2 = document.getElementById('tab2-content');

            if (tab === 1) {
                btn1.className = 'tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-blue-100 text-blue-700 border-2 border-blue-200 shadow-sm';
                btn2.className = 'tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-slate-50 text-slate-500 border-2 border-transparent hover:bg-slate-100';
                c1.classList.remove('hidden');
                c1.classList.add('flex');
                c2.classList.add('hidden');
                c2.classList.remove('flex');
                updateExplore();
            } else {
                btn2.className = 'tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-blue-100 text-blue-700 border-2 border-blue-200 shadow-sm';
                btn1.className = 'tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-slate-50 text-slate-500 border-2 border-transparent hover:bg-slate-100';
                c2.classList.remove('hidden');
                c2.classList.add('flex');
                c1.classList.add('hidden');
                c1.classList.remove('flex');
                loadChallenge();
            }
        }

        window.onload = () => {
            drawRuler();
            updateExplore();
        };

    </script>
</body>
</html>
