<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo Sposta-Virgola Interattivo</title>
    
    <!-- Caricamento di Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Font monospazio per garantire l'allineamento dei numeri e aiutare la lettura */
        .math-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Nasconde i pulsanti su/giù standard degli input di tipo numerico */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* Animazione per il semaforo verde */
        .pulse-green {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse-g 2s infinite;
        }
        @keyframes pulse-g {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .tab-btn {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-8 min-h-screen flex flex-col">

    <div class="max-w-6xl mx-auto w-full flex-grow flex flex-col gap-6">
        
        <!-- Intestazione e Navigazione -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
            <h1 class="text-3xl md:text-4xl font-bold text-slate-800 mb-2 mt-2">Lo Sposta-Virgola Interattivo</h1>
            <p class="text-slate-500 mb-6">Impara la notazione scientifica spostando fisicamente la virgola.</p>
            
            <div class="flex justify-center gap-4 flex-wrap">
                <button id="tab-explore" class="tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-blue-100 text-blue-700 border-2 border-blue-200 shadow-sm">
                    🔍 Modalità Esplora
                </button>
                <button id="tab-challenge" class="tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-slate-100 text-slate-500 border-2 border-transparent hover:bg-slate-200">
                    🎯 Modalità Sfida
                </button>
            </div>
        </header>

        <!-- ==========================================
             MODALITÀ ESPLORA
        =========================================== -->
        <div id="section-explore" class="flex-grow flex flex-col gap-6">
            
            <!-- Input Base -->
            <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200 flex flex-col items-center">
                <label class="block text-sm font-bold text-slate-500 uppercase tracking-wide mb-3 text-center">
                    Inserisci un numero (usa la virgola per i decimali)
                </label>
                <!-- Usiamo type="text" con inputmode="decimal" per forzare il controllo della virgola in JS -->
                <input type="text" inputmode="decimal" id="explore-input" class="math-font text-3xl text-center border-2 border-slate-300 rounded-xl p-3 w-full max-w-md focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500/20 transition-all" placeholder="es. 45000 oppure 0,0032" value="45000">
            </div>

            <!-- Interfaccia di Spostamento -->
            <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200 flex flex-col items-center flex-grow justify-center">
                
                <!-- Display del Numero Dinamico -->
                <div class="text-4xl md:text-7xl font-bold math-font flex items-center justify-center gap-4 text-slate-800 flex-wrap">
                    <span id="disp-mantissa" class="bg-slate-100 px-5 py-3 rounded-xl border border-slate-200 transition-colors duration-300">45000,0</span>
                    <span class="text-slate-400">&times;</span>
                    <div class="flex items-start">
                        <span>10</span>
                        <span id="disp-exponent" class="text-2xl md:text-4xl text-indigo-600 bg-indigo-50 px-3 py-1 rounded-xl border border-indigo-200 -mt-2 ml-1 shadow-inner">0</span>
                    </div>
                </div>

                <!-- Bottoni Spostamento -->
                <div class="flex justify-center gap-4 md:gap-8 mt-12 w-full">
                    <button id="btn-left" class="flex-1 max-w-[280px] bg-sky-500 hover:bg-sky-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg border-b-4 border-sky-700 text-lg md:text-xl flex flex-col items-center transform transition active:translate-y-1 active:border-b-0">
                        <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        <span>Sposta a Sinistra</span>
                        <span class="text-sm font-normal text-sky-100 mt-1">Diviso 10 &rarr; Esp. +1</span>
                    </button>
                    
                    <button id="btn-right" class="flex-1 max-w-[280px] bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg border-b-4 border-indigo-700 text-lg md:text-xl flex flex-col items-center transform transition active:translate-y-1 active:border-b-0">
                        <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        <span>Sposta a Destra</span>
                        <span class="text-sm font-normal text-indigo-100 mt-1">Per 10 &rarr; Esp. -1</span>
                    </button>
                </div>

            </div>

            <!-- Semaforo / Feedback visivo -->
            <div id="semaforo" class="bg-slate-100 border-2 border-slate-300 p-6 rounded-2xl text-center transition-all duration-500 flex items-center justify-center gap-5">
                <div id="semaforo-icon" class="w-12 h-12 rounded-full bg-slate-300 transition-all duration-500 flex-shrink-0"></div>
                <div class="text-left">
                    <h3 id="semaforo-title" class="text-xl font-bold text-slate-700">Mantissa Non Corretta</h3>
                    <p id="semaforo-desc" class="text-sm text-slate-500 mt-1">Sposta la virgola affinché il numero sia compreso tra 1 (incluso) e 10 (escluso).</p>
                </div>
            </div>

        </div>

        <!-- ==========================================
             MODALITÀ SFIDA
        =========================================== -->
        <div id="section-challenge" class="flex-grow flex flex-col gap-6 hidden">
            
            <!-- Visualizzazione Sfida -->
            <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200 text-center relative">
                <span class="inline-block px-4 py-1 bg-amber-100 text-amber-700 font-bold rounded-full text-xs uppercase tracking-wider mb-4 border border-amber-200">Database Scienze Integrate</span>
                
                <h2 id="chal-desc" class="text-2xl md:text-3xl font-bold text-slate-800 leading-tight">
                    <!-- Es: Diametro di una cellula vegetale (m) -->
                </h2>
                
                <p id="chal-target" class="text-4xl md:text-5xl font-bold text-indigo-600 mt-6 math-font bg-indigo-50 inline-block px-8 py-4 rounded-2xl border border-indigo-100 shadow-inner">
                    <!-- Es: 0,00005 -->
                </p>
            </div>

            <!-- Area Inserimento -->
            <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200 flex flex-col items-center">
                <label class="block text-base font-bold text-slate-600 uppercase tracking-wide mb-6">
                    Traduci in Notazione Scientifica
                </label>
                
                <div class="flex items-center justify-center gap-4 flex-wrap w-full max-w-2xl">
                    <!-- Mantissa Input -->
                    <div class="flex flex-col items-center flex-1 min-w-[150px]">
                        <label class="text-sm font-bold text-slate-400 mb-2">Mantissa (usa la virgola)</label>
                        <input type="text" inputmode="decimal" id="chal-mantissa" class="math-font text-3xl text-center border-2 border-slate-300 rounded-xl p-4 w-full focus:border-blue-500 focus:outline-none transition-colors" placeholder="es. 1,5">
                    </div>
                    
                    <span class="text-4xl font-bold text-slate-400 mt-6">&times; 10</span>
                    
                    <!-- Esponente Input -->
                    <div class="flex flex-col items-center flex-1 min-w-[120px]">
                        <label class="text-sm font-bold text-slate-400 mb-2">Esponente</label>
                        <input type="number" id="chal-exponent" class="math-font text-3xl text-center border-2 border-indigo-300 rounded-xl p-4 w-full focus:border-indigo-500 focus:outline-none -mt-6 transition-colors" placeholder="-4">
                    </div>
                </div>

                <button id="btn-verify" class="mt-10 w-full max-w-md bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-8 rounded-2xl shadow-lg transform transition active:scale-95 text-xl flex justify-center items-center gap-3">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    VERIFICA
                </button>

                <!-- Feedback Sfida -->
                <div id="chal-feedback" class="mt-6 w-full max-w-2xl p-5 rounded-xl hidden border">
                    <!-- Popolato da JS -->
                </div>
            </div>

            <!-- Pulsante Prossima Sfida -->
            <div class="text-center pb-6">
                <button id="btn-next" class="text-blue-600 font-bold hover:text-blue-800 transition-colors hidden text-lg flex items-center justify-center gap-2 mx-auto">
                    Prossima Sfida <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>

        </div>

    </div>

    <script>
        // ==========================================
        // GESTIONE TAB
        // ==========================================
        const tabExplore = document.getElementById('tab-explore');
        const tabChallenge = document.getElementById('tab-challenge');
        const secExplore = document.getElementById('section-explore');
        const secChallenge = document.getElementById('section-challenge');

        tabExplore.addEventListener('click', () => switchTab('explore'));
        tabChallenge.addEventListener('click', () => switchTab('challenge'));

        function switchTab(mode) {
            if (mode === 'explore') {
                tabExplore.className = 'tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-blue-100 text-blue-700 border-2 border-blue-200 shadow-sm';
                tabChallenge.className = 'tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-slate-100 text-slate-500 border-2 border-transparent hover:bg-slate-200';
                
                secExplore.classList.remove('hidden');
                secExplore.classList.add('flex');
                secChallenge.classList.add('hidden');
                secChallenge.classList.remove('flex');
            } else {
                tabChallenge.className = 'tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-blue-100 text-blue-700 border-2 border-blue-200 shadow-sm';
                tabExplore.className = 'tab-btn px-6 py-3 rounded-xl font-bold text-lg bg-slate-100 text-slate-500 border-2 border-transparent hover:bg-slate-200';
                
                secChallenge.classList.remove('hidden');
                secChallenge.classList.add('flex');
                secExplore.classList.add('hidden');
                secExplore.classList.remove('flex');
                
                if(!currentChallenge) loadNewChallenge();
            }
        }

        // ==========================================
        // FUNZIONE GLOBALE: FORZA LA VIRGOLA
        // ==========================================
        function enforceCommaFormat(inputElement) {
            // Sostituisce il punto con la virgola
            let val = inputElement.value.replace(/\./g, ',');
            // Permette solo cifre, virgola e il segno meno all'inizio
            val = val.replace(/(?!^-)[^0-9,]/g, '');
            // Rimuove eventuali virgole multiple
            let parts = val.split(',');
            if (parts.length > 2) {
                val = parts[0] + ',' + parts.slice(1).join('');
            }
            inputElement.value = val;
            return val;
        }

        // ==========================================
        // LOGICA MODALITÀ ESPLORA
        // ==========================================
        const exploreInput = document.getElementById('explore-input');
        const dispMantissa = document.getElementById('disp-mantissa');
        const dispExponent = document.getElementById('disp-exponent');
        const semaforo = document.getElementById('semaforo');
        const semaforoIcon = document.getElementById('semaforo-icon');
        const semaforoTitle = document.getElementById('semaforo-title');
        const semaforoDesc = document.getElementById('semaforo-desc');

        let expMantissaStr = "45000,0";
        let expExponent = 0;

        exploreInput.addEventListener('input', function() {
            let formatted = enforceCommaFormat(this);
            if (formatted === "" || formatted === "-" || formatted === ",") return;
            
            // Aggiunge ",0" se il numero è intero, per permettere lo spostamento fisico
            if (!formatted.includes(',')) {
                formatted += ',0';
            }
            expMantissaStr = formatted;
            expExponent = 0;
            updateExploreUI();
        });

        function shiftComma(direction) {
            let isNeg = expMantissaStr.startsWith('-');
            let str = isNeg ? expMantissaStr.substring(1) : expMantissaStr;
            let parts = str.split(',');
            let intPart = parts[0];
            let decPart = parts[1] || "";

            if (direction === -1) { 
                // SPOSTA A SINISTRA (dividi per 10)
                if (intPart === "" || intPart === "0") {
                    decPart = "0" + decPart;
                    intPart = "0";
                } else {
                    let moveChar = intPart.slice(-1);
                    intPart = intPart.slice(0, -1);
                    if (intPart === "") intPart = "0";
                    decPart = moveChar + decPart;
                }
                expExponent++;

            } else if (direction === 1) { 
                // SPOSTA A DESTRA (moltiplica per 10)
                if (decPart === "") {
                    intPart = intPart + "0";
                    decPart = "0";
                } else {
                    let moveChar = decPart.charAt(0);
                    decPart = decPart.substring(1);
                    intPart = intPart + moveChar;
                    
                    // Rimuove zeri non significativi a sinistra, es. 04 -> 4
                    if (intPart.length > 1 && intPart.startsWith('0')) {
                        intPart = intPart.replace(/^0+/, '');
                        if (intPart === '') intPart = '0';
                    }
                }
                if (decPart === "") decPart = "0"; 
                expExponent--;
            }

            expMantissaStr = (isNeg ? '-' : '') + intPart + ',' + decPart;
            updateExploreUI();
        }

        function updateExploreUI() {
            dispMantissa.textContent = expMantissaStr;
            dispExponent.textContent = expExponent;

            // Valutazione matematica per il semaforo
            let mathVal = parseFloat(expMantissaStr.replace(',', '.'));
            let absVal = Math.abs(mathVal);

            // Reset classi
            semaforo.className = "bg-slate-100 border-2 border-slate-300 p-6 rounded-2xl text-center transition-all duration-500 flex items-center justify-center gap-5";
            semaforoIcon.className = "w-12 h-12 rounded-full transition-all duration-500 flex-shrink-0 bg-slate-300";
            dispMantissa.className = "px-5 py-3 rounded-xl border transition-colors duration-300";
            semaforoTitle.textContent = "Analisi Mantissa";

            if (isNaN(absVal)) return;

            if (absVal >= 1 && absVal < 10) {
                // VERDE: Notazione Corretta
                semaforo.classList.replace('bg-slate-100', 'bg-green-50');
                semaforo.classList.replace('border-slate-300', 'border-green-400');
                semaforoIcon.classList.replace('bg-slate-300', 'bg-green-500');
                semaforoIcon.classList.add('pulse-green');
                semaforoTitle.classList.add('text-green-800');
                semaforoTitle.textContent = "Notazione Corretta!";
                semaforoDesc.innerHTML = `Perfetto! Il numero <strong>${absVal.toString().replace('.', ',')}</strong> è compreso tra 1 (incluso) e 10 (escluso).`;
                semaforoDesc.className = 'text-sm mt-1 text-green-700';
                dispMantissa.classList.add('bg-green-100', 'border-green-300', 'text-green-800');
            } else {
                // ROSSO: Non Corretta
                semaforo.classList.replace('bg-slate-100', 'bg-red-50');
                semaforo.classList.replace('border-slate-300', 'border-red-300');
                semaforoIcon.classList.replace('bg-slate-300', 'bg-red-500');
                semaforoTitle.classList.add('text-red-800');
                semaforoTitle.textContent = "Non in notazione scientifica";
                dispMantissa.classList.add('bg-red-50', 'border-red-200', 'text-red-800');
                
                let valStr = absVal.toString().replace('.', ',');
                if (absVal >= 10) {
                    semaforoDesc.innerHTML = `Sbagliato. <strong>${valStr}</strong> è troppo grande (\u2265 10). Sposta la virgola verso SINISTRA.`;
                } else if (absVal > 0 && absVal < 1) {
                    semaforoDesc.innerHTML = `Sbagliato. <strong>${valStr}</strong> è troppo piccolo (< 1). Sposta la virgola verso DESTRA.`;
                } else if (absVal === 0) {
                    semaforoDesc.textContent = "Lo Zero non si scrive in notazione scientifica.";
                }
                semaforoDesc.className = 'text-sm mt-1 text-red-700';
            }
        }

        document.getElementById('btn-left').addEventListener('click', () => shiftComma(-1));
        document.getElementById('btn-right').addEventListener('click', () => shiftComma(1));

        // Inizializzazione Esplora
        updateExploreUI();

        // ==========================================
        // LOGICA MODALITÀ SFIDA
        // ==========================================
        const challengeDB = [
            { desc: "Diametro di una cellula vegetale (m)", val: 0.00005, str: "0,00005" },
            { desc: "Massa di un trattore agricolo (kg)", val: 4500, str: "4500" },
            { desc: "Numero di batteri in 1g di suolo", val: 40000000, str: "40000000" },
            { desc: "Spessore di una foglia (m)", val: 0.0002, str: "0,0002" },
            { desc: "Diametro di un granello di polline (m)", val: 0.000015, str: "0,000015" },
            { desc: "Litri di acqua per irrigazione (L)", val: 150000, str: "150000" },
            { desc: "Massa di un seme (kg)", val: 0.0007, str: "0,0007" },
            { desc: "Dimensione particella di argilla (m)", val: 0.000002, str: "0,000002" },
            { desc: "Superficie di un campo agricolo (m²)", val: 25000, str: "25000" },
            { desc: "Massa di una mela (kg)", val: 0.15, str: "0,15" },
            { desc: "Velocità di crescita di un bambù (m/s)", val: 0.00001, str: "0,00001" },
            { desc: "Numero di afidi su una pianta", val: 2500, str: "2500" },
            { desc: "Produzione di grano globale (kg)", val: 770000000000, str: "770000000000" },
            { desc: "Diametro del fusto di una sequoia (m)", val: 8.5, str: "8,5" },
            { desc: "Massa di un acaro (kg)", val: 0.000000005, str: "0,000000005" },
            { desc: "Consumo di azoto per ettaro (kg)", val: 120, str: "120" },
            { desc: "Diametro goccia di pioggia (m)", val: 0.002, str: "0,002" },
            { desc: "Energia solare su 1 m² in un giorno (J)", val: 15000000, str: "15000000" },
            { desc: "Massa di un chicco di riso (kg)", val: 0.00003, str: "0,00003" },
            { desc: "Volume di una cellula animale (m³)", val: 0.000000000001, str: "0,000000000001" }
        ];

        let currentChallenge = null;
        let lastChallengeIndex = -1;

        const chalDesc = document.getElementById('chal-desc');
        const chalTarget = document.getElementById('chal-target');
        const chalMantissa = document.getElementById('chal-mantissa');
        const chalExponent = document.getElementById('chal-exponent');
        const btnVerifyChal = document.getElementById('btn-verify');
        const chalFeedback = document.getElementById('chal-feedback');
        const btnNext = document.getElementById('btn-next');

        // Formattazione input Sfida
        chalMantissa.addEventListener('input', function() {
            enforceCommaFormat(this);
            this.classList.remove('border-red-500', 'border-green-500');
        });
        chalExponent.addEventListener('input', function() {
            this.classList.remove('border-red-500', 'border-green-500');
        });

        function loadNewChallenge() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * challengeDB.length);
            } while (newIndex === lastChallengeIndex);
            
            lastChallengeIndex = newIndex;
            currentChallenge = challengeDB[newIndex];

            chalDesc.textContent = currentChallenge.desc;
            chalTarget.textContent = currentChallenge.str;
            
            // Reset UI
            chalMantissa.value = '';
            chalExponent.value = '';
            chalMantissa.classList.remove('border-red-500', 'border-green-500');
            chalExponent.classList.remove('border-red-500', 'border-green-500');
            chalFeedback.classList.add('hidden');
            btnNext.classList.add('hidden');
            
            chalMantissa.focus();
        }

        function verifyChallenge() {
            const mText = chalMantissa.value.replace(',', '.');
            const userM = parseFloat(mText);
            const userE = parseInt(chalExponent.value);

            if (isNaN(userM) || isNaN(userE)) {
                showChallengeFeedback(false, "Attenzione: Compila correttamente sia la mantissa che l'esponente numerico.");
                return;
            }

            // Resetta bordi
            chalMantissa.classList.remove('border-red-500', 'border-green-500');
            chalExponent.classList.remove('border-red-500', 'border-green-500');

            // Regola 1: Mantissa in range [1, 10)
            const absM = Math.abs(userM);
            const isMantissaCorrect = absM >= 1 && absM < 10;
            
            // Regola 2: Valore matematico equivalente (controllo tolleranza per float)
            const calculatedValue = userM * Math.pow(10, userE);
            const targetValue = currentChallenge.val;
            
            // Errore relativo piccolissimo per aggirare bug di Javascript con i float
            const isMathCorrect = Math.abs(calculatedValue - targetValue) / targetValue < 1e-5;

            if (isMantissaCorrect && isMathCorrect) {
                // TUTTO CORRETTO
                chalMantissa.classList.add('border-green-500');
                chalExponent.classList.add('border-green-500');
                showChallengeFeedback(true, `
                    <h3 class="font-bold text-lg mb-1">🎉 Risposta Esatta!</h3>
                    <p>Hai tradotto correttamente <strong>${currentChallenge.str}</strong> in notazione scientifica.</p>
                `);
                btnNext.classList.remove('hidden');
            } else {
                // ERRORE: Capiamo dove ha sbagliato lo studente
                let feedbackHtml = `<h3 class="font-bold text-lg mb-2">❌ C'è un errore</h3><ul class="list-disc pl-5 space-y-1">`;
                
                if (!isMantissaCorrect) {
                    chalMantissa.classList.add('border-red-500');
                    feedbackHtml += `<li>La <strong>mantissa</strong> inserita (${chalMantissa.value}) non rispetta la regola: deve essere compresa tra 1 (incluso) e 10 (escluso).</li>`;
                } else {
                    chalMantissa.classList.add('border-green-500'); // Mantissa formalmente ok
                }

                if (!isMathCorrect) {
                    if (isMantissaCorrect) chalExponent.classList.add('border-red-500'); // Colpa dell'esponente
                    
                    if (targetValue < 1 && userE > 0) {
                        feedbackHtml += `<li>Attenzione all'esponente: per i numeri molto piccoli (0,...) l'esponente deve essere <strong>negativo</strong>.</li>`;
                    } else if (targetValue > 10 && userE < 0) {
                        feedbackHtml += `<li>Attenzione all'esponente: per i numeri molto grandi l'esponente deve essere <strong>positivo</strong>.</li>`;
                    } else {
                        feedbackHtml += `<li>Il valore matematico non corrisponde a ${currentChallenge.str}. Controlla i salti della virgola per calcolare l'esponente esatto.</li>`;
                    }
                } else if (!isMantissaCorrect && isMathCorrect) {
                     // Caso: 45 x 10^3 (matematica giusta, notazione errata)
                     chalExponent.classList.add('border-green-500');
                     feedbackHtml += `<li>Il valore matematico è corretto, ma la forma <strong>non è in notazione scientifica standard</strong>. Sistema la virgola nella mantissa e bilancia di nuovo l'esponente!</li>`;
                }

                feedbackHtml += `</ul>`;
                showChallengeFeedback(false, feedbackHtml);
            }
        }

        function showChallengeFeedback(isSuccess, htmlContent) {
            chalFeedback.classList.remove('hidden', 'bg-green-50', 'border-green-300', 'text-green-900', 'bg-red-50', 'border-red-300', 'text-red-900');
            
            if (isSuccess) {
                chalFeedback.classList.add('bg-green-50', 'border-green-300', 'text-green-900');
            } else {
                chalFeedback.classList.add('bg-red-50', 'border-red-300', 'text-red-900');
            }
            
            chalFeedback.innerHTML = htmlContent;
        }

        btnVerifyChal.addEventListener('click', verifyChallenge);
        btnNext.addEventListener('click', loadNewChallenge);

    </script>
</body>
</html>
