<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizi Somma Algebrica</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            margin-bottom: 5px;
            color: var(--primary);
        }
        .header p {
            color: #7f8c8d;
            font-size: 1.1em;
        }
        /* Griglia a 2 colonne per gli esercizi */
        .exercise-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .exercise-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.6em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .exercise-card.correct {
            border-color: var(--success);
            background-color: #f1fdf5;
        }
        .exercise-card.error {
            border-color: var(--danger);
            background-color: #fdf3f2;
        }
        .expression {
            flex-grow: 1;
            text-align: right;
            padding-right: 15px;
            letter-spacing: 2px;
        }
        input[type="number"] {
            font-size: 1em;
            width: 80px;
            padding: 5px;
            text-align: center;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            outline: none;
        }
        input[type="number"]:focus {
            border-color: var(--accent);
        }
        .controls {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        button {
            font-size: 1.2em;
            padding: 12px 25px;
            margin: 0 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-check { background-color: var(--accent); }
        .btn-new { background-color: #95a5a6; }
        
        #score-display {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 15px;
            min-height: 35px;
        }
        .feedback-icon {
            width: 30px;
            text-align: center;
            font-size: 1.2em;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Esercizi Somme Algebriche</h1>
        
    <div class="exercise-grid" id="grid">
        <!-- Gli esercizi verranno generati qui dal JavaScript -->
    </div>

    <div class="controls">
        <button class="btn-check" onclick="checkAnswers()">Verifica Risultati</button>
        <button class="btn-new" onclick="generateExercises()">Genera Nuova Scheda</button>
        <div id="score-display"></div>
    </div>

    <script>
        const NUM_EXERCISES = 10;
        let correctAnswers = [];

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function formatExpression(a, b) {
            // Formatta il primo numero (se positivo non mettiamo il +, se negativo mettiamo il -)
            let strA = a.toString();
            // Formatta il secondo numero (se positivo mettiamo +, se negativo mettiamo - con spaziature)
            let strB = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
            return `${strA} ${strB} =`;
        }

        function generateExercises() {
            const grid = document.getElementById('grid');
            grid.innerHTML = ''; // Pulisce la griglia
            correctAnswers = [];
            document.getElementById('score-display').innerHTML = '';

            for (let i = 0; i < NUM_EXERCISES; i++) {
                // Genera due numeri tra -20 e +20
                let a = getRandomInt(-20, 20);
                let b = getRandomInt(-20, 20);
                
                // Evitiamo le somme banali con gli zeri per tenere alto il livello dell'allenamento
                if (a === 0) a = getRandomInt(1, 20) * (Math.random() > 0.5 ? 1 : -1);
                if (b === 0) b = getRandomInt(1, 20) * (Math.random() > 0.5 ? 1 : -1);

                correctAnswers.push(a + b);

                // Creazione degli elementi HTML
                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.id = `card-${i}`;

                const exp = document.createElement('div');
                exp.className = 'expression';
                exp.innerText = formatExpression(a, b);

                const input = document.createElement('input');
                input.type = 'number';
                input.id = `input-${i}`;
                input.autocomplete = 'off';
                
                // Permette di passare alla casella successiva premendo "Invio"
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        let nextInput = document.getElementById(`input-${i + 1}`);
                        if (nextInput) nextInput.focus();
                        else checkAnswers();
                    }
                });

                const icon = document.createElement('div');
                icon.className = 'feedback-icon';
                icon.id = `icon-${i}`;

                card.appendChild(exp);
                card.appendChild(input);
                card.appendChild(icon);
                grid.appendChild(card);
            }
            
            // Focussa automaticamente il primo input
            document.getElementById('input-0').focus();
        }

        function checkAnswers() {
            let score = 0;
            let allAnswered = true;

            for (let i = 0; i < NUM_EXERCISES; i++) {
                const inputElement = document.getElementById(`input-${i}`);
                const card = document.getElementById(`card-${i}`);
                const icon = document.getElementById(`icon-${i}`);
                const userAnswer = inputElement.value;

                // Reset degli stili
                card.className = 'exercise-card';
                icon.innerHTML = '';

                if (userAnswer === '') {
                    allAnswered = false;
                    continue;
                }

                if (parseInt(userAnswer) === correctAnswers[i]) {
                    card.classList.add('correct');
                    icon.innerHTML = '✅';
                    score++;
                } else {
                    card.classList.add('error');
                    icon.innerHTML = '❌';
                }
            }

            const scoreDisplay = document.getElementById('score-display');
            if (!allAnswered) {
                scoreDisplay.style.color = '#e67e22';
                scoreDisplay.innerHTML = `Hai compilato solo alcune caselle. Completa tutto!`;
            } else {
                let color = score === NUM_EXERCISES ? '#27ae60' : (score > 5 ? '#2980b9' : '#e74c3c');
                scoreDisplay.style.color = color;
                
                let message = `Punteggio: ${score} / ${NUM_EXERCISES}`;
                if (score === NUM_EXERCISES) message += " - Perfetto! Ottimo calcolo mentale.";
                
                scoreDisplay.innerHTML = message;
            }
        }

        // Avvia il generatore all'apertura della pagina
        window.onload = generateExercises;
    </script>
</body>
</html>
