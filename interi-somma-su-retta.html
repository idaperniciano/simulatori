<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulatore Somma Interi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { margin-top: 0; color: #2c3e50; font-size: 1.8rem; }
        .expression {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 20px 0;
            color: #34495e;
        }
        .active-number {
            border-bottom: 4px solid #f1c40f;
            padding-bottom: 2px;
        }
        .instructions {
            font-size: 1.2rem;
            color: #555;
            min-height: 1.5em;
            margin-bottom: 15px;
            font-weight: 500;
        }
        canvas {
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            max-width: 100%;
            margin-bottom: 20px;
        }
        .btn-group { margin: 15px 0; }
        button {
            font-size: 1.2rem;
            padding: 12px 24px;
            margin: 0 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            color: white;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
        button:active { transform: translateY(2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-left { background-color: #e74c3c; } /* Rosso per -1 */
        .btn-right { background-color: #2ecc71; } /* Verde per +1 */
        .btn-check { background-color: #3498db; margin-top: 20px; font-size: 1.1rem; }
        .btn-new { background-color: #9b59b6; margin-top: 20px; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Somma algebrica sulla retta</h1>
    
    <div class="expression" id="expressionText"></div>
    <div class="instructions" id="instructionText">Premi "Nuovo Calcolo" per iniziare.</div>
    
    <canvas id="numberLine" width="850" height="250"></canvas>
    
    <div class="btn-group">
        <button class="btn-left" id="btnLeft">-1 (Salta a Sinistra)</button>
        <button class="btn-right" id="btnRight">+1 (Salta a Destra)</button>
    </div>
    
    <div class="btn-group">
        <button class="btn-check" id="btnCheck" style="display:none;">Controlla il Risultato</button>
        <button class="btn-new" id="btnNew">Genera Nuovo Calcolo</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('numberLine');
    const ctx = canvas.getContext('2d');
    
    const expressionText = document.getElementById('expressionText');
    const instructionText = document.getElementById('instructionText');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnCheck = document.getElementById('btnCheck');
    const btnNew = document.getElementById('btnNew');

    // Variabili di stato
    let num1, num2;
    let currentPos = 0;
    let hops = []; // Array per memorizzare i salti compiuti {start, end, color}
    
    let activeAddend = 1; // 1 per il primo numero, 2 per il secondo, 3 completato
    let stepsDone = 0; 
    let targetSteps = 0;
    let requiredDirection = 1; // 1 per destra, -1 per sinistra
    let activeColor = '#3498db'; // Azzurro per primo numero, Arancio per secondo

    function formatNumber(n) {
        return n >= 0 ? `+${n}` : `${n}`;
    }

    function initGame() {
        // Genera due numeri che sommati stiano tra -10 e +10
        do {
            num1 = Math.floor(Math.random() * 21) - 10; // tra -10 e +10
            num2 = Math.floor(Math.random() * 21) - 10; 
        } while (Math.abs(num1 + num2) > 10 || (num1 === 0 && num2 === 0));

        currentPos = 0;
        hops = [];
        activeAddend = 1;
        stepsDone = 0;
        targetSteps = Math.abs(num1);
        requiredDirection = Math.sign(num1) || 1;
        activeColor = '#3498db'; // Colore primo addendo
        
        // Gestione caso particolare in cui num1 sia 0
        if (num1 === 0) {
            nextAddend();
        }

        btnCheck.style.display = 'none';
        btnLeft.disabled = false;
        btnRight.disabled = false;
        
        updateUI();
        drawScene();
    }

    function nextAddend() {
        activeAddend = 2;
        stepsDone = 0;
        targetSteps = Math.abs(num2);
        requiredDirection = Math.sign(num2) || 1;
        activeColor = '#e67e22'; // Colore secondo addendo
        
        if (num2 === 0) {
            finishJumping();
        }
    }

    function finishJumping() {
        activeAddend = 3;
        btnLeft.disabled = true;
        btnRight.disabled = true;
        btnCheck.style.display = 'inline-block';
        instructionText.innerText = "Salti completati! Ora clicca su 'Controlla il Risultato'.";
        updateUI();
    }

    function makeHop(direction) {
        if (activeAddend > 2) return;
        
        if (direction !== requiredDirection) {
            instructionText.innerText = "Attenzione! Devi andare verso " + (requiredDirection > 0 ? "destra (+)" : "sinistra (-)") + ".";
            instructionText.style.color = "red";
            setTimeout(updateUI, 1500);
            return;
        }

        // Registra il salto
        let newPos = currentPos + direction;
        hops.push({ start: currentPos, end: newPos, color: activeColor });
        currentPos = newPos;
        stepsDone++;

        if (stepsDone >= targetSteps) {
            if (activeAddend === 1) {
                nextAddend();
            } else {
                finishJumping();
            }
        }
        
        updateUI();
        drawScene();
    }

    function updateUI() {
        if (activeAddend < 3) instructionText.style.color = "#555";

        let str1 = formatNumber(num1);
        let str2 = formatNumber(num2);
        
        if (activeAddend === 1) {
            expressionText.innerHTML = `(<span class="active-number" style="color:#3498db">${str1}</span>) + (${str2}) = ?`;
            instructionText.innerText = `Attualmente stai posizionando il primo numero (${str1}). Mancano ${targetSteps - stepsDone} salti.`;
        } else if (activeAddend === 2) {
            expressionText.innerHTML = `(${str1}) + (<span class="active-number" style="color:#e67e22">${str2}</span>) = ?`;
            instructionText.innerText = `Attualmente stai aggiungendo il secondo numero (${str2}). Mancano ${targetSteps - stepsDone} salti.`;
        } else {
            expressionText.innerHTML = `(${str1}) + (${str2}) = ?`;
        }
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const yAxis = 150;
        const xOffset = 50;
        const spacing = (canvas.width - xOffset * 2) / 20;

        // Disegna la retta
        ctx.beginPath();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.moveTo(xOffset, yAxis);
        ctx.lineTo(canvas.width - xOffset + 15, yAxis); // Linea principale
        ctx.stroke();

        // Freccia solo a destra (convenzione europea)
        ctx.beginPath();
        ctx.fillStyle = '#333';
        ctx.moveTo(canvas.width - xOffset + 20, yAxis);
        ctx.lineTo(canvas.width - xOffset + 5, yAxis - 6);
        ctx.lineTo(canvas.width - xOffset + 5, yAxis + 6);
        ctx.fill();

        // Tacche e numeri
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        for (let i = -10; i <= 10; i++) {
            let x = xOffset + (i + 10) * spacing;
            
            // Tacca
            ctx.beginPath();
            ctx.moveTo(x, yAxis - 8);
            ctx.lineTo(x, yAxis + 8);
            ctx.stroke();

            // Evidenzia lo zero
            if (i === 0) {
                ctx.fillStyle = '#e74c3c';
                ctx.font = 'bold 16px Arial';
            } else {
                ctx.fillStyle = '#333';
                ctx.font = '14px Arial';
            }
            ctx.fillText(i, x, yAxis + 25);
        }

        // Disegna i salti compiuti
        hops.forEach((hop, index) => {
            let x1 = xOffset + (hop.start + 10) * spacing;
            let x2 = xOffset + (hop.end + 10) * spacing;
            let midX = (x1 + x2) / 2;
            let radius = spacing / 2;
            let midY = yAxis - radius - 15 - (activeAddend===2 && index<Math.abs(num1) ? 5 : 0); // Sfalsa leggermente il primo addendo se necessario

            ctx.beginPath();
            ctx.strokeStyle = hop.color;
            ctx.lineWidth = 3;
            // Disegna un arco a parabola per il salto
            ctx.moveTo(x1, yAxis);
            ctx.quadraticCurveTo(midX, yAxis - spacing * 1.2, x2, yAxis);
            ctx.stroke();

            // Punta della freccia del salto (alla fine dell'arco)
            ctx.beginPath();
            ctx.fillStyle = hop.color;
            ctx.arc(x2, yAxis - 3, 4, 0, Math.PI * 2);
            ctx.fill();
        });

        // Disegna Marker (pedina) attuale
        let currentX = xOffset + (currentPos + 10) * spacing;
        ctx.beginPath();
        ctx.fillStyle = '#2c3e50';
        ctx.arc(currentX, yAxis, 8, 0, Math.PI * 2);
        ctx.fill();
    }

    // Event Listeners
    btnLeft.addEventListener('click', () => makeHop(-1));
    btnRight.addEventListener('click', () => makeHop(1));
    
    btnNew.addEventListener('click', initGame);
    
    btnCheck.addEventListener('click', () => {
        let somma = num1 + num2;
        if (currentPos === somma) {
            instructionText.innerHTML = `<span style="color:#2ecc71; font-weight:bold; font-size: 1.4rem;">Corretto! Il risultato finale è ${formatNumber(somma)}</span>`;
            expressionText.innerHTML = `(${formatNumber(num1)}) + (${formatNumber(num2)}) = ${formatNumber(somma)}`;
        }
        btnCheck.style.display = 'none';
    });

    // Avvia al caricamento
    initGame();
</script>

</body>
</html>
